name: PR

# Builds and tests the projects a pull request's changes reach, in both Debug and Release, and
# holds any changed library to full line and branch coverage.
#
#   plan ──┬──► debug  shard 0..N ──► restore, build, test, coverage gate
#          │
#          └──► release shard 0..N ──► restore, build, test
#
# Which projects each shard owns is decided by build/ci.sh plan.

on:
  pull_request:
    branches: [master]
  merge_group:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A merge group is tested against the queue's base, applying the affected-set narrowing to
  # queued merges. Left empty, every merge becomes a full-repository build.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Every timeout below is sized to catch a hang, not to bound how long the work takes.
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 0.6
    outputs:
      any: ${{ steps.plan.outputs.any }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against the merge base needs history but not file contents.
          fetch-depth: 0
          filter: blob:none

      - id: plan
        run: bash runner/in-container.sh plan

      # Every later job downloads this rather than planning again, so all stages shard alike.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify build assumptions
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 0.6
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - run: bash runner/in-container.sh verify

  debug:
    name: Debug (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 0.6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci

      - id: restore
        name: Restore
        run: bash runner/in-container.sh restore Debug

      - id: build
        name: Build
        run: bash runner/in-container.sh build Debug

      - id: test
        name: Test
        run: bash runner/in-container.sh test Debug

      # Debug only: optimised IL does not map onto the source well enough to measure branches.
      # No if: always(), because coverage from a part-way test run measures nothing useful.
      - id: gate
        name: Coverage gate
        run: bash runner/in-container.sh coverage-gate Debug

      - name: Summarise
        if: always()
        run: CI_STAGE=Debug bash runner/in-container.sh summarise
            "restore=${{ steps.restore.outcome }}"
            "build=${{ steps.build.outcome }}"
            "test=${{ steps.test.outcome }}"
            "coverage-gate=${{ steps.gate.outcome }}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-Debug-shard-${{ matrix.shard }}
          path: artifacts/coverage-report/Debug
          if-no-files-found: ignore

  release:
    name: Release (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 0.6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci

      - id: restore
        name: Restore
        run: bash runner/in-container.sh restore Release

      - id: build
        name: Build
        run: bash runner/in-container.sh build Release

      - id: test
        name: Test
        run: bash runner/in-container.sh test Release

      - name: Summarise
        if: always()
        run: CI_STAGE=Release bash runner/in-container.sh summarise
            "restore=${{ steps.restore.outcome }}"
            "build=${{ steps.build.outcome }}"
            "test=${{ steps.test.outcome }}"

  # Mark this as the required check. The shard count varies per pull request, so the matrix jobs
  # cannot be named in the ruleset, and a skipped job must not read as a failure.
  pr:
    name: PR
    needs: [plan, verify, debug, release]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 0.6
    steps:
      - name: Check results
        run: |
          echo "plan:    ${{ needs.plan.result }} (any: ${{ needs.plan.outputs.any }})"
          echo "verify:  ${{ needs.verify.result }}"
          echo "debug:   ${{ needs.debug.result }}"
          echo "release: ${{ needs.release.result }}"

          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.verify.result }}" \
                        "${{ needs.debug.result }}" "${{ needs.release.result }}"; do
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one required job did not succeed. The run summary lists each stage and shard with the phase that failed."
            exit 1
          fi

          echo "All required jobs succeeded or were skipped."
