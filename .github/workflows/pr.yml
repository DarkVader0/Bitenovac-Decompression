name: PR

# Builds and tests the projects a pull request's changes reach, in both Debug and Release, and
# holds any changed library to full line and branch coverage.
#
# What runs is derived from the project reference graph, not from directory names: a project is
# selected when it changed or when it depends, directly or transitively, on something that
# changed. Nothing upstream of a change is retested.
#
# Shape:
#
#   plan ──┬──► debug  shard 0..N ──► restore, build, test, coverage gate
#          │
#          └──► release shard 0..N ──► restore, build, test
#
# The two configurations are independent stages that start together, so a change that compiles
# in Debug and fails under optimised IL cannot be merged. Within a stage each shard owns a
# disjoint slice of the affected projects and finishes on its own, with no barrier before the
# coverage gate; build/shards.awk keeps a project and every test project covering it in the same
# shard.
#
# The logic lives in build/ci.sh so anything CI does can be reproduced locally:
#   CHANGED_FILES=src/libraries/.../Foo.cs bash build/ci.sh plan

on:
  pull_request:
    branches: [master]
  merge_group:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A merge group is tested against the queue's base, applying the affected-set narrowing to
  # queued merges. Left empty, every merge becomes a full-repository build.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Timeouts are per job, the only granularity GitHub offers, and a job covers runner start-up,
  # the SDK install and every project in its shard. They are sized to catch a hang rather than to
  # bound one project: restore and build run all of a shard's projects in a single MSBuild
  # session, leaving no per-project process to time.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      any: ${{ steps.plan.outputs.any }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against the merge base needs commit history but not file contents; a blobless
          # clone fetches blobs on demand.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - id: plan
        run: bash build/ci.sh plan

      # Every later job reads this instead of recomputing it, which would risk the two stages
      # disagreeing about the shard partition.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify build assumptions
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Pure text analysis over the project files; it needs no SDK and no packages.
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      # The API is skipped on library changes because it consumes the algorithms as versioned
      # packages and is therefore not a dependent of anything under src/libraries. A project
      # reference would turn every library change into an API build.
      - run: bash build/ci.sh verify

  debug:
    name: Debug (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Overhead plus up to PROJECTS_PER_SHARD projects built, tested and coverage-gated.
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the central version list, which is the only file that changes what gets
          # restored. There are no lock files to hash: see the comment in build/ci.sh restore.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore local tools
        run: dotnet tool restore

      - id: restore
        name: Restore
        run: bash build/ci.sh restore Debug

      - id: build
        name: Build
        run: bash build/ci.sh build Debug

      - id: test
        name: Test
        run: bash build/ci.sh test Debug

      # Coverage is gated on Debug only. Release IL is optimised and inlined, so the branch
      # points coverlet records no longer map one-to-one onto the source: the same fully covered
      # code measures 96.6% branch coverage in Release. Tests still run in both configurations;
      # only the measurement is taken from the unoptimised build.
      #
      # Not run when the tests failed. Coverage collected from a run that died part-way measures
      # how far the tests got, reporting failures unrelated to coverage and burying the real one.
      - id: gate
        name: Coverage gate
        run: bash build/ci.sh coverage-gate Debug

      - name: Summarise
        if: always()
        run: CI_STAGE=Debug bash build/ci.sh summarise
            "restore=${{ steps.restore.outcome }}"
            "build=${{ steps.build.outcome }}"
            "test=${{ steps.test.outcome }}"
            "coverage-gate=${{ steps.gate.outcome }}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-Debug-shard-${{ matrix.shard }}
          path: artifacts/coverage-report/Debug
          if-no-files-found: ignore

  release:
    name: Release (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Same work as the Debug stage without the coverage gate.
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the central version list, which is the only file that changes what gets
          # restored. There are no lock files to hash: see the comment in build/ci.sh restore.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - id: restore
        name: Restore
        run: bash build/ci.sh restore Release

      - id: build
        name: Build
        run: bash build/ci.sh build Release

      - id: test
        name: Test
        run: bash build/ci.sh test Release

      - name: Summarise
        if: always()
        run: CI_STAGE=Release bash build/ci.sh summarise
            "restore=${{ steps.restore.outcome }}"
            "build=${{ steps.build.outcome }}"
            "test=${{ steps.test.outcome }}"

  # The single check to mark as required in the ruleset. It stays green when a job is skipped --
  # a docs-only pull request selects nothing -- and red when one fails, which a list of
  # individually-required conditional jobs cannot do. It is also stable under sharding: the shard
  # count changes with every pull request, so matrix jobs cannot be named as required checks.
  pr:
    name: PR
    needs: [plan, verify, debug, release]
    if: always()
    runs-on: ubuntu-latest
    # Reads four job results and exits.
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          echo "plan:    ${{ needs.plan.result }} (any: ${{ needs.plan.outputs.any }})"
          echo "verify:  ${{ needs.verify.result }}"
          echo "debug:   ${{ needs.debug.result }}"
          echo "release: ${{ needs.release.result }}"

          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.verify.result }}" \
                        "${{ needs.debug.result }}" "${{ needs.release.result }}"; do
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one required job did not succeed. Every shard ran to completion; the run summary lists each stage and shard with the phase that failed."
            exit 1
          fi

          echo "All required jobs succeeded or were skipped."
